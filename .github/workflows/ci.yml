name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  typecheck:
    name: Type Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ github.actor == 'dependabot[bot]' && fromJSON('["24"]') || fromJSON('["24", "22", "20"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
